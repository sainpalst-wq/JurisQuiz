<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JurisQuiz Colombia</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1f2433;--mut:#6b7080;--line:#e6e0d4;--acc:#b8860b;--acc2:#1e3a5f;--ok:#2e7d4f;--bad:#b3392f;--okbg:#e6f4ea;--badbg:#fbe9e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1d212c;--ink:#eee9df;--mut:#9aa0b0;--line:#2c3140;--acc:#e0b04a;--acc2:#8fb4e8;--ok:#6cc48c;--bad:#ef7f74;--okbg:#17301f;--badbg:#3a1d1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161d;--card:#1d212c;--ink:#eee9df;--mut:#9aa0b0;--line:#2c3140;--acc:#e0b04a;--acc2:#8fb4e8;--ok:#6cc48c;--bad:#ef7f74;--okbg:#17301f;--badbg:#3a1d1a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.9rem;margin:8px 0 4px;color:var(--acc2)}
h1 span{color:var(--acc)}
.sub{color:var(--mut);margin:0 0 18px;font-family:system-ui,sans-serif;font-size:.95rem}
.sans{font-family:system-ui,-apple-system,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.branch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;transition:transform .12s,border-color .12s}
.branch:hover{transform:translateY(-2px);border-color:var(--acc)}
.branch.sel{border:2px solid var(--acc);background:var(--okbg)}
.branch .e{font-size:1.6rem;display:block}
.branch b{display:block;font-size:1rem;margin-top:4px}
.branch small{color:var(--mut);font-family:system-ui,sans-serif;font-size:.78rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-family:system-ui,sans-serif;font-size:.9rem}
.chip.sel{background:var(--acc2);color:var(--bg);border-color:var(--acc2)}
.btn{background:var(--acc2);color:var(--bg);border:0;border-radius:12px;padding:14px 22px;font:inherit;font-family:system-ui,sans-serif;font-weight:600;font-size:1rem;cursor:pointer;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--acc2);border:1px solid var(--acc2);margin-top:10px}
.bar{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mut);margin-bottom:8px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{font-size:1.2rem;margin:0 0 16px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;font:inherit;color:var(--ink);cursor:pointer;font-family:system-ui,sans-serif;font-size:.97rem}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.exp{background:var(--card);border-left:4px solid var(--acc);border-radius:8px;padding:12px 14px;margin:14px 0;font-family:system-ui,sans-serif;font-size:.93rem}
.exp em{color:var(--mut);display:block;margin-top:6px;font-size:.82rem}
.center{text-align:center;padding:40px 0}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.score{font-size:3rem;color:var(--acc);margin:6px 0}
.err{background:var(--badbg);border:1px solid var(--bad);border-radius:10px;padding:12px;font-family:system-ui,sans-serif;font-size:.92rem;margin:12px 0}
.note{color:var(--mut);font-family:system-ui,sans-serif;font-size:.78rem;margin-top:22px;text-align:center}
.hide{display:none}
input.f{width:100%;padding:13px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-family:system-ui,sans-serif}
.tabs{display:flex;gap:8px;margin:16px 0 8px}
a#out{color:var(--acc2)}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
  <p class="note">Contenido educativo generado por IA. Verifica siempre en la norma vigente; no sustituye asesoría jurídica.</p>
</div>
<script>
const BRANCHES=[
{id:"constitucional",n:"Constitucional",e:"🏛️",d:"Constitución de 1991, tutela, Corte"},
{id:"penal",n:"Penal",e:"⚖️",d:"Código Penal y Proceso Penal"},
{id:"civil",n:"Civil",e:"📜",d:"Personas, bienes, obligaciones"},
{id:"laboral",n:"Laboral",e:"👷",d:"Contratos, prestaciones, seguridad social"},
{id:"familia",n:"Familia",e:"👨‍👩‍👧",d:"Matrimonio, alimentos, filiación"},
{id:"administrativo",n:"Administrativo",e:"🏢",d:"Estado, contratación, CPACA"},
{id:"comercial",n:"Comercial",e:"💼",d:"Sociedades, títulos valores"},
{id:"procesal",n:"Procesal",e:"🗂️",d:"Código General del Proceso"},
{id:"tributario",n:"Tributario",e:"🧾",d:"Impuestos, DIAN, Estatuto Tributario"},
{id:"ddhh",n:"DD. HH. e Internacional",e:"🌎",d:"Derechos humanos, bloque de constitucionalidad"},
{id:"mix",n:"Todas las ramas",e:"🎲",d:"Sorpresa mezclada"}
];
const LEVELS=["Básico","Intermedio","Avanzado"];
const N=8;
let st={user:"",left:0,branch:null,level:1,qs:[],i:0,score:0,streak:0,best:0,answered:false,seen:[]};
const app=document.getElementById("app");
const $=(h)=>{app.innerHTML=h};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(accion,data){
  const res=await fetch("/api/juego",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(sessionStorage.getItem("jq")||"")},body:JSON.stringify({accion,...data})});
  let j={};try{j=await res.json()}catch(_){}
  if(!res.ok){const e=new Error(j.detail||("Error "+res.status+(res.status===404?": el servidor no está desplegado":"")));e.code=res.status;throw e}
  return j;
}
function authScreen(err,tab){
  tab=tab||"entrar";const reg=tab==="registro";
  const inv=new URLSearchParams(location.search).get("inv")||"";
  $(`<h1>Juris<span>Quiz</span> Colombia</h1><p class="sub">Entra para jugar. Tienes 20 partidas por día.</p>
  <div class="tabs"><button class="chip ${reg?"":"sel"}" id="t1">Entrar</button><button class="chip ${reg?"sel":""}" id="t2">Crear cuenta</button></div>
  ${err?`<div class="err">${esc(err)}</div>`:""}
  <input class="f" id="u" placeholder="Usuario" autocapitalize="none" autocomplete="username">
  <input class="f" id="p" type="password" placeholder="Contraseña (mín. 8 caracteres)" autocomplete="${reg?"new-password":"current-password"}">
  ${reg?`<input class="f" id="c" placeholder="Código del enlace de invitación" value="${esc(inv)}" autocapitalize="none">`:""}
  <button class="btn" id="ok" style="margin-top:10px">${reg?"Crear cuenta":"Entrar"}</button>`);
  document.getElementById("t1").onclick=()=>authScreen("","entrar");
  document.getElementById("t2").onclick=()=>authScreen("","registro");
  document.getElementById("ok").onclick=async()=>{
    const btn=document.getElementById("ok");btn.disabled=true;
    try{
      const j=await api(reg?"registro":"entrar",{usuario:document.getElementById("u").value,clave:document.getElementById("p").value,invitacion:reg?document.getElementById("c").value:undefined});
      sessionStorage.setItem("jq",j.token);st.user=j.usuario;st.left=j.restantes;home();
    }catch(e){authScreen(e.message,tab)}
  };
}
async function boot(){
  if(new URLSearchParams(location.search).get("inv")&&!sessionStorage.getItem("jq"))return authScreen("","registro");
  if(!sessionStorage.getItem("jq"))return authScreen();
  try{const j=await api("estado",{});st.user=j.usuario;st.left=j.restantes;home();}catch(e){authScreen()}
}
function home(err){
  $(`<div class="bar"><span>👤 ${esc(st.user)} · 🎟️ ${st.left} partidas hoy</span><a href="#" id="out">Salir</a></div><h1>Juris<span>Quiz</span> Colombia</h1>
  <p class="sub">Pon a prueba tu conocimiento del derecho colombiano. Cada partida trae preguntas nuevas, creadas en el momento.</p>
  ${err?`<div class="err">${esc(err)}</div>`:""}
  <p class="sans" style="margin:0 0 8px"><b>1. Elige una rama</b></p>
  <div class="grid">${BRANCHES.map(b=>`<button class="branch ${st.branch===b.id?"sel":""}" data-b="${b.id}"><span class="e">${b.e}</span><b>${b.n}</b><small>${b.d}</small></button>`).join("")}</div>
  <p class="sans" style="margin:18px 0 0"><b>2. Nivel</b></p>
  <div class="row">${LEVELS.map((l,i)=>`<button class="chip ${st.level===i?"sel":""}" data-l="${i}">${l}</button>`).join("")}</div>
  <button class="btn" id="go" ${st.branch?"":"disabled"}>Comenzar (${N} preguntas)</button>`);
  app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{st.branch=b.dataset.b;home()});
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{st.level=+b.dataset.l;home()});
  document.getElementById("go").onclick=start;
  document.getElementById("out").onclick=e=>{e.preventDefault();sessionStorage.removeItem("jq");authScreen()};
}

function loading(){ $(`<div class="center"><div class="spin"></div><p class="sans">Preparando tus preguntas…</p></div>`); }

async function start(){
  if(!navigator.onLine){return home("Necesitas conexión a internet para jugar.");}
  loading();
  try{
    const r=await api("preguntas",{branch:st.branch,level:st.level,seen:st.seen.slice(-30)});st.left=r.restantes;
    const arr=Array.isArray(r)?r:(r&&r.questions)||[];
    st.qs=arr.filter(x=>x&&x.q&&Array.isArray(x.options)&&x.options.length===4&&Number.isInteger(x.answer)).map(x=>{
      const correct=x.options[x.answer];
      const o=x.options.map(t=>String(t)).sort(()=>Math.random()-.5);
      return {q:x.q,o,a:o.indexOf(String(correct)),e:x.explanation||"",r:x.ref||""};
    });
    if(st.qs.length<3) throw new Error("vacío");
    st.seen.push(...st.qs.map(x=>x.q.slice(0,70)));
    Object.assign(st,{i:0,score:0,streak:0,best:0});
    question();
  }catch(e){
    if(e.code===401)return authScreen(e.message);
    home(e.message||"No pudimos generar las preguntas.");
  }
}

function question(){
  const q=st.qs[st.i];st.answered=false;
  const b=BRANCHES.find(x=>x.id===st.branch);
  $(`<div class="bar"><span>${b.e} ${b.n} · ${LEVELS[st.level]}</span><span>⭐ ${st.score} · 🔥 ${st.streak}</span></div>
  <div class="prog"><i style="width:${st.i/st.qs.length*100}%"></i></div>
  <div class="bar"><span>Pregunta ${st.i+1} de ${st.qs.length}</span></div>
  <p class="q">${esc(q.q)}</p>
  <div id="opts">${q.o.map((t,k)=>`<button class="opt" data-k="${k}">${esc(t)}</button>`).join("")}</div>
  <div id="fb"></div>`);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}

function answer(k){
  if(st.answered)return;st.answered=true;
  const q=st.qs[st.i],ok=k===q.a;
  if(ok){st.streak++;st.best=Math.max(st.best,st.streak);st.score+=10+Math.min(st.streak-1,5)*2;}else st.streak=0;
  app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("ok");else if(j===k)b.classList.add("bad");});
  const last=st.i===st.qs.length-1;
  document.getElementById("fb").innerHTML=`<div class="exp"><b>${ok?"¡Correcto!":"Incorrecto."}</b> ${esc(q.e)}${q.r?`<em>📖 ${esc(q.r)}</em>`:""}</div><p class="sans" style="text-align:center;margin:8px 0"><a href="#" id="rp" style="color:var(--mut);font-size:.85rem">Reportar error en esta pregunta</a></p><button class="btn" id="nx">${last?"Ver resultado":"Siguiente"}</button>`;
  document.getElementById("nx").onclick=()=>{if(last)result();else{st.i++;question();}};
  document.getElementById("rp").onclick=async e=>{e.preventDefault();const l=e.target;l.textContent="Enviando…";try{await api("reportar",{q:q.q,o:q.o,a:k,ref:q.r});l.textContent="Gracias, lo revisaremos."}catch(_){l.textContent="No se pudo enviar el reporte."}};
}

function result(){
  const max=st.qs.length*10;const pct=st.score/(max+Math.min(st.qs.length,6)*10)>0.6;
  const msg=st.score>=max*1.1?"¡Magistrado/a de la Corte! ⚖️":st.score>=max*.8?"¡Excelente litigante! 👏":st.score>=max*.5?"Buen camino, sigue estudiando 📚":"A repasar los códigos 💪";
  $(`<div class="center"><h1>Resultado</h1><div class="score">${st.score} pts</div><p class="sans">${msg}</p><p class="sans" style="color:var(--mut)">Mejor racha: 🔥 ${st.best}</p></div>
  <button class="btn" id="again">Jugar de nuevo (preguntas nuevas)</button>
  <button class="btn alt" id="menu">Cambiar de rama</button>`);
  document.getElementById("again").onclick=start;
  document.getElementById("menu").onclick=()=>home();
}
window.addEventListener("offline",()=>{if(!st.qs.length)home("Sin conexión a internet.");});
boot();
</script>
</body>
</html>
